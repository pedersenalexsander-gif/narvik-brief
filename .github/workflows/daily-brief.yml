name: Oppdater Narvik Brief

on:
  schedule:
    # GitHub Actions har minimum ca. 5 minutters intervall. Vi bruker 15 min for en stabil live-brief.
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: narvik-live-brief
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Sjekk ut repo
        uses: actions/checkout@v4

      - name: Sett opp Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Hent de siste nyhetene
        run: python scripts/update_news.py

      - name: Commit og push hvis topp 10 har endret seg
        shell: bash
        run: |
          if git diff --quiet -- data/news.json; then
            echo "Ingen nye saker siden sist."
            exit 0
          fi
          git config user.name "narvik-brief-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/news.json
          git commit -m "Oppdater siste 10 nyhetssaker"
          git push
