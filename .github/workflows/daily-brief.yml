name: Oppdater Alex Brief

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: alex-live-brief
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Sjekk ut repo
        uses: actions/checkout@v4

      - name: Sett opp Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Hent, kvalitetsfiltrer og oppsummer nyhetene gratis
        run: python scripts/update_news.py

      - name: Commit og push hvis briefen er endret
        id: publish
        shell: bash
        run: |
          if git diff --quiet -- data/news.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Ingen nye saker siden sist."
            exit 0
          fi
          git config user.name "alex-brief-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/news.json
          git commit -m "Oppdater Alex Brief"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Be GitHub Pages bygge den nye briefen
        if: steps.publish.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail-with-body -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/pages/builds"
